name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Cache build directory
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-cmake-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-${{ matrix.build_type }}-

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libntl-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gmp ntl

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: make -C build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run tests (excluding slow/heavy/stress)
      working-directory: build
      # CI runners are 2-4 vCPU; full GNFS pipelines (slow/heavy/stress
      # labels) routinely take 5-60 min and time out. Skip them here —
      # they are exercised in nightly/manual runs via scripts/test.sh.
      # `gate` label tests still run (RegressionGate ~60s).
      run: |
        ctest --output-on-failure \
          --label-exclude "slow|heavy|stress" \
          --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu) \
          --timeout 120
