name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.platform_label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Stable matrix (must pass) ──
          - os: ubuntu-24.04
            platform_label: Linux x86_64 (gcc, Release)
            build_type: Release
            cxx_compiler: g++
            test_labels: 'instant|fast'
            ctest_parallel: 2
            experimental: false
          - os: ubuntu-24.04
            platform_label: Linux x86_64 (clang, Debug)
            build_type: Debug
            cxx_compiler: clang++
            test_labels: 'instant'
            ctest_parallel: 2
            experimental: false
          - os: ubuntu-22.04
            platform_label: Linux x86_64 (gcc, Ubuntu 22.04)
            build_type: Release
            cxx_compiler: g++
            test_labels: 'instant|fast'
            ctest_parallel: 2
            experimental: false
          - os: macos-14
            platform_label: macOS arm64 (clang, Release)
            build_type: Release
            cxx_compiler: clang++
            test_labels: 'instant|fast'
            ctest_parallel: 2
            experimental: false
          # ── Linux ARM64 native (free for public repos on github-hosted) ──
          # See https://github.blog/changelog/2025-01-16-linux-arm64-hosted-runners-now-available-for-free-in-public-repositories/
          # Marked experimental in case the runner is unavailable on private repos.
          - os: ubuntu-24.04-arm
            platform_label: Linux arm64 (gcc, Release)
            build_type: Release
            cxx_compiler: g++
            test_labels: 'instant'
            ctest_parallel: 2
            experimental: true
          # ── Windows MSVC (required instant coverage; vcpkg-based GMP) ──
          - os: windows-latest
            platform_label: Windows x86_64 (msvc, Release)
            build_type: Release
            cxx_compiler: ''
            test_labels: 'instant'
            ctest_parallel: 2
            experimental: false

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false

    - name: Cache build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: ${{ matrix.os }}-${{ runner.arch }}-${{ matrix.cxx_compiler }}-cmake-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**') }}
        restore-keys: |
          ${{ matrix.os }}-${{ runner.arch }}-${{ matrix.cxx_compiler }}-cmake-${{ matrix.build_type }}-

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libgmp-dev libntl-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gmp ntl

    # ── Windows: vcpkg-based GMP install ──
    # vcpkg is preinstalled on windows-latest runners at $env:VCPKG_INSTALLATION_ROOT
    # (C:\vcpkg). Install the gmp port and let the vcpkg toolchain file feed
    # find_package/find_library hints to CMake.
    - name: Install dependencies (Windows / vcpkg)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install gmp:x64-windows

    # ── Configure: POSIX vs Windows multi-config split ──
    - name: Configure CMake (POSIX)
      if: runner.os != 'Windows'
      env:
        CXX_COMPILER: ${{ matrix.cxx_compiler }}
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER="${CXX_COMPILER}" \
          -DGNFS_ENABLE_NATIVE_ARCH=OFF

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DGNFS_ENABLE_NATIVE_ARCH=OFF `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build (POSIX)
      id: build_posix
      if: runner.os != 'Windows'
      run: cmake --build build --parallel "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Run selected tests (POSIX)
      if: runner.os != 'Windows'
      working-directory: build
      env:
        GNFS_TEST_REQUIRE_AUTHENTICATED_LINUX: ${{ runner.os == 'Linux' && !matrix.experimental && '1' || '' }}
      # Cross-platform PR coverage stays on instant/fast tests. Real GNFS
      # pipeline tests run in the Linux Release deep-gate job below.
      run: |
        ctest --output-on-failure \
          --label-regex "${{ matrix.test_labels }}" \
          --label-exclude "slow|heavy|stress|bench|gate" \
          --parallel "${{ matrix.ctest_parallel }}" \
          --timeout 300 \
          --no-tests=error

    - name: Run macOS worker cleanup tail
      if: >-
        ${{
          !cancelled() &&
          steps.build_posix.outcome == 'success' &&
          matrix.os == 'macos-14' &&
          matrix.build_type == 'Release'
        }}
      run: |
        test -x build/test_distributed_sieve_worker_cleanup_tail
        ./scripts/test.sh -t Release --no-build --no-color run \
          test_distributed_sieve_worker_cleanup_tail

    - name: Run macOS worker cleanup authorization publisher
      if: >-
        ${{
          !cancelled() &&
          steps.build_posix.outcome == 'success' &&
          matrix.os == 'macos-14' &&
          matrix.build_type == 'Release'
        }}
      run: |
        test -x build/test_distributed_sieve_worker_cleanup_authorization_publisher
        ./scripts/test.sh -t Release --no-build --no-color run \
          test_distributed_sieve_worker_cleanup_authorization_publisher

    - name: Run macOS worker cleanup orchestrator
      if: >-
        ${{
          !cancelled() &&
          steps.build_posix.outcome == 'success' &&
          matrix.os == 'macos-14' &&
          matrix.build_type == 'Release'
        }}
      run: |
        test -x build/test_distributed_sieve_worker_cleanup_orchestrator
        ./scripts/test.sh -t Release --no-build --no-color run \
          test_distributed_sieve_worker_cleanup_orchestrator

    # Windows: multi-config generator places binaries under build/<Config>/,
    # so we pass -C to ctest and use PowerShell parallel-count syntax.
    - name: Run selected tests (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: build
      run: |
        ctest --output-on-failure `
          --label-regex "${{ matrix.test_labels }}" `
          --label-exclude "slow|heavy|stress|bench|gate" `
          --parallel ${{ matrix.ctest_parallel }} `
          --timeout 300 `
          --no-tests=error `
          -C ${{ matrix.build_type }}

  linux-release-gate:
    name: Linux x86_64 Release deep gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libntl-dev

    - name: Configure CMake
      run: |
        cmake -B build-gate \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=g++ \
          -DGNFS_ENABLE_NATIVE_ARCH=OFF

    - name: Build
      run: cmake --build build-gate --parallel "$(nproc)"

    - name: Run gate and slow tests
      working-directory: build-gate
      run: |
        ctest --output-on-failure \
          --label-regex "gate|slow" \
          --label-exclude "heavy|stress|bench" \
          --parallel 1 \
          --timeout 1800 \
          --no-tests=error

  linux-musl-transport:
    name: Alpine 3.21 musl transport boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false

    - name: Build and test in Alpine 3.21
      shell: bash
      run: |
        docker run --rm \
          --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src,readonly" \
          --env TMPDIR=/tmp \
          alpine:3.21 \
          /bin/sh -euxc '
            apk add --no-cache build-base cmake gmp-dev linux-headers
            install -d -m 0700 /gnfs-src
            cp -a /src/. /gnfs-src/
            chown 0:0 /gnfs-src
            chmod 0700 /gnfs-src
            cmake -S /gnfs-src -B /tmp/gnfs-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DGNFS_BUILD_TESTS=ON \
              -DGNFS_BUILD_FUZZERS=OFF \
              -DGNFS_ENABLE_NATIVE_ARCH=OFF
            cmake --build /tmp/gnfs-build \
              --target \
                test_bounded_child_process \
                test_siqs_shadow_proof_rss_campaign_journal_store \
              --parallel 2
            ctest --test-dir /tmp/gnfs-build \
              --output-on-failure \
              -R "^(BoundedChildProcess|SiqsShadowProofRssCampaignJournalStore)$" \
              --timeout 120 \
              --no-tests=error
          '

  required:
    name: CI required
    runs-on: ubuntu-24.04
    needs:
      - build-and-test
      - linux-release-gate
      - linux-musl-transport
    if: always()
    timeout-minutes: 5

    steps:
    - name: Verify required matrix
      shell: bash
      run: |
        if [[ "${{ needs.build-and-test.result }}" != "success" ||
              "${{ needs.linux-release-gate.result }}" != "success" ||
              "${{ needs.linux-musl-transport.result }}" != "success" ]]; then
          echo "Required CI matrix result: ${{ needs.build-and-test.result }}"
          echo "Linux Release deep gate result: ${{ needs.linux-release-gate.result }}"
          echo "Alpine musl transport boundary result: ${{ needs.linux-musl-transport.result }}"
          exit 1
        fi
        echo "Required CI matrix, Linux Release deep gate, and Alpine musl boundary passed."
