name: Release Readiness

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cmake-closure:
    name: Linux pinned CMake wheel closure
    runs-on: ubuntu-24.04
    container: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Install Ubuntu 20.04 bootstrap
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=4 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=4 install -y \
            --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gnupg \
            python3 \
            python3-pip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          python3 scripts/release_contract.py verify-checkout \
            --target-sha "${TARGET_SHA}"

      - name: Install pinned Linux release toolchain
        run: bash scripts/install_linux_release_toolchain.sh

      - name: Install hash-pinned CMake
        run: |
          python3 -m pip install \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement scripts/release-cmake-requirements.txt
          [[ "$(cmake --version | awk 'NR == 1 { print $3 }')" == '3.31.6' ]]

      - name: Build pinned Linux LTO closure
        run: |
          cmake -B build-release-readiness -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=scripts/linux-release-gcc12-toolchain.cmake \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF
          cmake --build build-release-readiness --parallel
          [[ "$(build-release-readiness/gnfs --version)" == 'GNFS v0.1.0' ]]

  windows-runtime-closure:
    name: Windows pinned runtime and source closure
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python scripts/release_contract.py verify-checkout \
            --target-sha "${TARGET_SHA}"

      - name: Capture source date epoch
        id: source
        shell: bash
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install minimal MSYS2 build shell
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install digest-pinned compiler and runtime packages
        shell: msys2 {0}
        run: |
          python scripts/windows_release_runtime.py install-pinned \
            --download-directory pinned-windows-packages \
            --evidence-output pinned-windows-packages.json

      - name: Build and install Windows release tree
        shell: msys2 {0}
        run: |
          cmake -B build-release-readiness -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NTL=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF
          cmake --build build-release-readiness --parallel
          cmake --install build-release-readiness \
            --prefix dist/gnfs-v0.1.0-windows-x86_64

      - name: Materialize canonical project license
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: git show "${TARGET_SHA}:LICENSE" > canonical-project-LICENSE

      - name: Bundle and validate exact runtime/source closure
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ github.sha }}
        shell: msys2 {0}
        run: |
          python scripts/windows_release_runtime.py bundle \
            --package-root dist/gnfs-v0.1.0-windows-x86_64 \
            --executable dist/gnfs-v0.1.0-windows-x86_64/bin/gnfs.exe \
            --pinned-package-evidence pinned-windows-packages.json \
            --project-license canonical-project-LICENSE \
            --release-tag v0.1.0 \
            --target-sha "${TARGET_SHA}"
          mkdir packages
          python scripts/reproducible_archive.py create \
            --source dist/gnfs-v0.1.0-windows-x86_64 \
            --output packages/gnfs-v0.1.0-windows-x86_64.zip \
            --format zip \
            --epoch "${SOURCE_DATE_EPOCH}"
          python scripts/release_contract.py validate-cli-archive \
            --archive packages/gnfs-v0.1.0-windows-x86_64.zip \
            --platform windows-x86_64 \
            --release-tag v0.1.0
