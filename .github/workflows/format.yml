name: Format

on:
  push:
    branches: [ main, dev ]
    paths:
      - '.clang-format'
      - '.github/workflows/format.yml'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - '.clang-format'
      - '.github/workflows/format.yml'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Check every tracked C/C++ source file'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      FULL_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.full_scan == 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          pathspec=( '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' )
          # A leading ./ makes clang-format treat names beginning with @ as source paths.
          files="${RUNNER_TEMP}/clang-format-files"
          if [[ "${FULL_SCAN}" == "true" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            git ls-files -z --format='./%(path)' -- "${pathspec[@]}" > "$files"
          else
            git diff --name-only -z --line-prefix=./ --diff-filter=ACMR "${BASE_SHA}" "${GITHUB_SHA}" -- \
              "${pathspec[@]}" > "$files"
          fi

          if [[ ! -s "$files" ]]; then
            echo "No C/C++ files changed."
            exit 0
          fi
          xargs -0 clang-format --dry-run --Werror -- < "$files"
