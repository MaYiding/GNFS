name: Workflow Security

on:
  push:
    branches: [ main, dev ]
    paths:
      - '.github/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - '.github/**'
  schedule:
    - cron: '50 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check workflow syntax and expressions
        run: |
          "${HOME}/go/bin/actionlint" -color

  zizmor:
    name: zizmor CI/CD security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          inputs: .github
          persona: regular
          min-severity: medium
          min-confidence: medium
          version: v1.25.2
