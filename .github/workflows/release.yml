name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify artifacts first, then publish the exact verified bytes'
        required: true
        type: choice
        options:
          - verify-only
          - publish
      release_tag:
        description: 'First release tag (contract-locked to v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      target_sha:
        description: 'Current origin/main full 40-character SHA'
        required: true
        type: string
      confirmation:
        description: 'Type VERIFY v0.1.0 or PUBLISH v0.1.0 to match the selected mode'
        required: true
        type: string

permissions:
  actions: read  # Resolve exact-SHA runs and download immutable artifacts.
  checks: read  # Match required jobs to commit check runs.
  contents: read  # Checkout source and inspect main/tag refs.

concurrency:
  group: release-${{ inputs.release_tag }}-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact main SHA and CI preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verification_run_id: ${{ steps.prior.outputs.verification_run_id }}
      workbench_run_id: ${{ steps.main-ci.outputs.workbench_run_id }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate immutable dispatch inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release_contract.py validate-dispatch \
            --mode "${MODE}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --confirmation "${CONFIRMATION}" \
            --repository "${REPOSITORY}" \
            --workflow-ref "${WORKFLOW_REF}" \
            --workflow-sha "${WORKFLOW_SHA}"

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Verify current main and every triggered push workflow
        id: main-ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py verify-main \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --evidence-output main-ci-evidence/main-ci-evidence.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload exact-SHA main CI evidence
        if: inputs.mode == 'verify-only'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-main-ci-evidence-${{ github.run_id }}
          path: main-ci-evidence/main-ci-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Find successful verify-only evidence
        id: prior
        if: inputs.mode == 'publish'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py find-verification \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  qualification:
    name: Deep release qualification
    if: inputs.mode == 'verify-only'
    needs: preflight
    uses: ./.github/workflows/release-qualification.yml
    with:
      target_sha: ${{ inputs.target_sha }}
    permissions:
      contents: read

  package-linux:
    name: Package linux-x86_64 on glibc 2.31
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ubuntu-24.04
    container: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    timeout-minutes: 75
    defaults:
      run:
        shell: bash

    steps:
      - name: Install Ubuntu 20.04 build environment
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            gnupg \
            python3 \
            python3-pip \
            software-properties-common
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            g++-12 \
            gcc-12 \
            libgmp-dev \
            libntl-dev \
            ninja-build
          python3 -m pip install --no-cache-dir cmake==3.31.6

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py verify-checkout \
            --target-sha "${TARGET_SHA}"

      - name: Capture source date epoch
        id: source
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Configure and build
        run: |
          cmake -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF
          cmake --build build-release --parallel

      - name: Verify, install, and archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          package_name="gnfs-${RELEASE_TAG}-linux-x86_64"
          prefix="dist/${package_name}"
          cmake --install build-release --prefix "${prefix}"
          python3 scripts/release_binary_contract.py linux \
            --executable "${prefix}/bin/gnfs" \
            --metadata-output "${prefix}/binary-compatibility.json" \
            --readme-output "${prefix}/README-release.txt" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          version_output=$("${prefix}/bin/gnfs" --version)
          if [[ "${version_output}" != "GNFS ${RELEASE_TAG}" ]]; then
            echo "CLI version ${version_output} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          cp LICENSE "${prefix}/LICENSE"
          printf '%s\n' \
            "THIRD-PARTY NOTICES" \
            "" \
            "GMP and NTL dynamic libraries are not bundled in this archive." \
            "Exact GLIBC, GLIBCXX, and CXXABI requirements are in binary-compatibility.json." \
            "Install compatible host copies and consult their separately distributed licenses." \
            > "${prefix}/THIRD_PARTY_NOTICES.txt"
          mkdir packages
          python3 scripts/reproducible_archive.py create \
            --source "${prefix}" \
            --output "packages/${package_name}.tar.gz" \
            --format tar.gz \
            --epoch "${SOURCE_DATE_EPOCH}"
          python3 scripts/release_contract.py validate-cli-archive \
            --archive "packages/${package_name}.tar.gz" \
            --platform linux-x86_64 \
            --release-tag "${RELEASE_TAG}"

      - name: Upload packaged Linux CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gnfs-linux-x86_64
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  package-cli:
    name: Package ${{ matrix.asset_suffix }}
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset_suffix: macos-arm64
            archive_format: tar.gz
            python: python3
          - os: windows-2022
            asset_suffix: windows-x86_64
            archive_format: zip
            python: python

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          PYTHON: ${{ matrix.python }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          "${PYTHON}" scripts/release_contract.py verify-checkout \
            --target-sha "${TARGET_SHA}"

      - name: Capture source date epoch
        id: source
        shell: bash
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp ntl

      - name: Install dependencies (Windows / MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ntl
            mingw-w64-ucrt-x86_64-python

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build-release --config Release --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build-release --parallel

      - name: Install and archive (macOS)
        if: runner.os == 'macOS'
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="gnfs-${RELEASE_TAG}-${ASSET_SUFFIX}"
          prefix="dist/${package_name}"
          cmake --install build-release --prefix "${prefix}"
          python3 scripts/release_binary_contract.py macos \
            --executable "${prefix}/bin/gnfs"
          version_output=$("${prefix}/bin/gnfs" --version)
          if [[ "${version_output}" != "GNFS ${RELEASE_TAG}" ]]; then
            echo "CLI version ${version_output} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          cp LICENSE "${prefix}/LICENSE"
          printf '%s\n' \
            "GNFS ${RELEASE_TAG}" \
            "Built from ${TARGET_SHA}" \
            "macOS arm64; requires macOS 13.0 or newer." \
            "GMP and NTL dynamic libraries are required from the host and are not bundled." \
            "See LICENSE and THIRD_PARTY_NOTICES.txt." \
            > "${prefix}/README-release.txt"
          printf '%s\n' \
            "THIRD-PARTY NOTICES" \
            "" \
            "GMP and NTL dynamic libraries are not bundled in this archive." \
            "Install compatible host copies and consult their separately distributed licenses." \
            > "${prefix}/THIRD_PARTY_NOTICES.txt"
          mkdir -p packages
          python3 scripts/reproducible_archive.py create \
            --source "${prefix}" \
            --output "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --format "${ARCHIVE_FORMAT}" \
            --epoch "${SOURCE_DATE_EPOCH}"
          python3 scripts/release_contract.py validate-cli-archive \
            --archive "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --platform macos-arm64 \
            --release-tag "${RELEASE_TAG}"

      - name: Install and archive (Windows)
        if: runner.os == 'Windows'
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          package_name="gnfs-${RELEASE_TAG}-${ASSET_SUFFIX}"
          prefix="dist/${package_name}"
          cmake --install build-release --prefix "${prefix}"
          python scripts/windows_release_runtime.py bundle \
            --package-root "${prefix}" \
            --executable "${prefix}/bin/gnfs.exe" \
            --project-license LICENSE \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          mkdir -p packages
          python scripts/reproducible_archive.py create \
            --source "${prefix}" \
            --output "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --format "${ARCHIVE_FORMAT}" \
            --epoch "${SOURCE_DATE_EPOCH}"
          python scripts/release_contract.py validate-cli-archive \
            --archive "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --platform windows-x86_64 \
            --release-tag "${RELEASE_TAG}"

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gnfs-${{ matrix.asset_suffix }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  collect-workbench:
    name: Collect exact-SHA Workbench artifact
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download Workbench artifact from the exact push run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gnfs-workbench-macos-arm64
          path: workbench-ci
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.workbench_run_id }}
          github-token: ${{ github.token }}

      - name: Validate Workbench checksum and embedded source revision
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py validate-workbench \
            --artifact-directory workbench-ci \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          mkdir packages
          cp "workbench-ci/GNFSWorkbench-${RELEASE_TAG#v}-macOS-arm64.zip" packages/

      - name: Upload verified Workbench package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gnfs-workbench
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  assemble-verification:
    name: Assemble immutable verification bundle
    if: inputs.mode == 'verify-only'
    needs:
      - preflight
      - qualification
      - package-linux
      - package-cli
      - collect-workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download package jobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gnfs-*
          path: release-assets
          merge-multiple: true

      - name: Download exact-SHA main CI evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-main-ci-evidence-${{ github.run_id }}
          path: main-ci-evidence

      - name: Generate metadata, checksums, and verification proof
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python3 scripts/release_contract.py assemble \
            --asset-directory release-assets \
            --release-tag "${RELEASE_TAG}" \
            --source-date-epoch "${source_date_epoch}" \
            --target-sha "${TARGET_SHA}"
          mkdir verification-proof
          python3 scripts/release_contract.py write-proof \
            --asset-directory release-assets \
            --ci-evidence main-ci-evidence/main-ci-evidence.json \
            --output verification-proof/release-verification.json \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"

      - name: Upload immutable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-verification-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: verification-proof/release-verification.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish previously verified bytes
    if: inputs.mode == 'publish'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read  # Download the exact prior verification artifacts.
      checks: read  # Recheck exact-SHA required job contexts.
      contents: write  # Create the locked tag, draft, and release assets.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download previously verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.verification_run_id }}
          github-token: ${{ github.token }}

      - name: Download prior verification proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-verification-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: verification-proof
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.verification_run_id }}
          github-token: ${{ github.token }}

      - name: Revalidate proof, current main, CI, and unpublished state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py verify-proof \
            --asset-directory release-assets \
            --proof verification-proof/release-verification.json \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          python3 scripts/release_contract.py verify-main \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"

      - name: Create draft release with verified assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "GNFS ${RELEASE_TAG}" \
            "" \
            "Source revision: ${TARGET_SHA}" \
            "" \
            "The macOS Workbench is ad-hoc signed and is not Apple notarized." \
            "Verify every downloaded file with SHA256SUMS." \
            > release-notes.md
          gh release create "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --draft \
            release-assets/GNFSWorkbench-0.1.0-macOS-arm64.zip \
            release-assets/gnfs-v0.1.0-linux-x86_64.tar.gz \
            release-assets/gnfs-v0.1.0-macos-arm64.tar.gz \
            release-assets/gnfs-v0.1.0-windows-x86_64.zip \
            release-assets/release-metadata.json \
            release-assets/SHA256SUMS
          draft_release_id=$(gh api \
            "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.id')
          if [[ ! "${draft_release_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Draft release has an invalid id: ${draft_release_id}" >&2
            exit 1
          fi
          echo "release_id=${draft_release_id}" >> "${GITHUB_OUTPUT}"

      - name: Revalidate main, CI, draft identity, tag, and asset bytes; then publish
        env:
          EXPECTED_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_contract.py final-prepublish \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --expected-release-id "${EXPECTED_RELEASE_ID}" \
            --asset-directory release-assets
          published_release_id=$(gh api \
            --method PATCH \
            "repos/${REPOSITORY}/releases/${EXPECTED_RELEASE_ID}" \
            -F draft=false \
            --jq 'if .draft == false then .id else error("release remained draft") end')
          if [[ "${published_release_id}" != "${EXPECTED_RELEASE_ID}" ]]; then
            echo "Published release id changed to ${published_release_id}." >&2
            exit 1
          fi
