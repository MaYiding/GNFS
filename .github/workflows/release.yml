name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify artifacts first, then publish the exact verified bytes'
        required: true
        type: choice
        options:
          - verify-only
          - publish
      release_tag:
        description: 'First release tag (contract-locked to v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      target_sha:
        description: 'Current origin/main full 40-character SHA'
        required: true
        type: string
      confirmation:
        description: 'Type VERIFY v0.1.0 or PUBLISH v0.1.0 to match the selected mode'
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact main SHA and CI preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verification_run_id: ${{ steps.prior.outputs.verification_run_id }}
      workbench_run_id: ${{ steps.main-ci.outputs.workbench_run_id }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate immutable dispatch inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release_contract.py validate-dispatch \
            --mode "${MODE}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --confirmation "${CONFIRMATION}" \
            --repository "${REPOSITORY}" \
            --workflow-ref "${WORKFLOW_REF}" \
            --workflow-sha "${WORKFLOW_SHA}"

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Verify current main and every triggered push workflow
        id: main-ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py verify-main \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Find successful verify-only evidence
        id: prior
        if: inputs.mode == 'publish'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py find-verification \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  qualification:
    name: Deep release qualification
    if: inputs.mode == 'verify-only'
    needs: preflight
    uses: ./.github/workflows/release-qualification.yml
    with:
      target_sha: ${{ inputs.target_sha }}
    permissions:
      contents: read

  package-cli:
    name: Package ${{ matrix.asset_suffix }}
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_suffix: linux-x86_64
            archive_format: tar.gz
            python: python3
          - os: macos-15
            asset_suffix: macos-arm64
            archive_format: tar.gz
            python: python3
          - os: windows-2022
            asset_suffix: windows-x86_64
            archive_format: zip
            python: python

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          PYTHON: ${{ matrix.python }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          "${PYTHON}" scripts/release_contract.py verify-checkout \
            --target-sha "${TARGET_SHA}"

      - name: Capture source date epoch
        id: source
        shell: bash
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libntl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp ntl

      - name: Install dependencies (Windows / MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ntl
            mingw-w64-ucrt-x86_64-python

      - name: Configure CMake (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF

      - name: Build (POSIX)
        if: runner.os != 'Windows'
        run: cmake --build build-release --config Release --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build-release --parallel

      - name: Install and archive (POSIX)
        if: runner.os != 'Windows'
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="gnfs-${RELEASE_TAG}-${ASSET_SUFFIX}"
          prefix="dist/${package_name}"
          cmake --install build-release --prefix "${prefix}"
          version_output=$("${prefix}/bin/gnfs" --version)
          if [[ "${version_output}" != "GNFS ${RELEASE_TAG}" ]]; then
            echo "CLI version ${version_output} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          printf '%s\n' \
            "GNFS ${RELEASE_TAG}" \
            "Built from ${TARGET_SHA}" \
            "" \
            "This archive contains the gnfs CLI, headers, and static libraries." \
            "The host must provide compatible GMP and NTL runtime libraries." \
            > "${prefix}/README-release.txt"
          mkdir -p packages
          python3 scripts/reproducible_archive.py create \
            --source "${prefix}" \
            --output "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --format "${ARCHIVE_FORMAT}" \
            --epoch "${SOURCE_DATE_EPOCH}"

      - name: Install and archive (Windows)
        if: runner.os == 'Windows'
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          package_name="gnfs-${RELEASE_TAG}-${ASSET_SUFFIX}"
          prefix="dist/${package_name}"
          cmake --install build-release --prefix "${prefix}"
          mapfile -t runtime_dlls < <(
            ldd "${prefix}/bin/gnfs.exe" \
              | awk '$3 ~ /^\/ucrt64\// {print $3}' \
              | sort -u
          )
          if (( ${#runtime_dlls[@]} == 0 )); then
            echo 'No UCRT64 runtime DLLs were resolved for gnfs.exe.' >&2
            exit 1
          fi
          for runtime_dll in "${runtime_dlls[@]}"; do
            test -f "${runtime_dll}"
            cp "${runtime_dll}" "${prefix}/bin/"
          done
          version_output=$("${prefix}/bin/gnfs.exe" --version)
          if [[ "${version_output}" != "GNFS ${RELEASE_TAG}" ]]; then
            echo "CLI version ${version_output} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          printf '%s\n' \
            "GNFS ${RELEASE_TAG}" \
            "Built from ${TARGET_SHA}" \
            "" \
            "This archive contains the gnfs CLI, headers, static libraries, and UCRT64 DLLs." \
            > "${prefix}/README-release.txt"
          mkdir -p packages
          python scripts/reproducible_archive.py create \
            --source "${prefix}" \
            --output "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --format "${ARCHIVE_FORMAT}" \
            --epoch "${SOURCE_DATE_EPOCH}"

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gnfs-${{ matrix.asset_suffix }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  collect-workbench:
    name: Collect exact-SHA Workbench artifact
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download Workbench artifact from the exact push run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gnfs-workbench-macos-arm64
          path: workbench-ci
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.workbench_run_id }}
          github-token: ${{ github.token }}

      - name: Validate Workbench checksum and embedded source revision
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py validate-workbench \
            --artifact-directory workbench-ci \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          mkdir packages
          cp "workbench-ci/GNFSWorkbench-${RELEASE_TAG#v}-macOS-arm64.zip" packages/

      - name: Upload verified Workbench package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gnfs-workbench
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  assemble-verification:
    name: Assemble immutable verification bundle
    if: inputs.mode == 'verify-only'
    needs:
      - preflight
      - qualification
      - package-cli
      - collect-workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download package jobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gnfs-*
          path: release-assets
          merge-multiple: true

      - name: Generate metadata, checksums, and verification proof
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python3 scripts/release_contract.py assemble \
            --asset-directory release-assets \
            --release-tag "${RELEASE_TAG}" \
            --source-date-epoch "${source_date_epoch}" \
            --target-sha "${TARGET_SHA}"
          mkdir verification-proof
          python3 scripts/release_contract.py write-proof \
            --asset-directory release-assets \
            --output verification-proof/release-verification.json \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"

      - name: Upload immutable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-verification-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: verification-proof/release-verification.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish previously verified bytes
    if: inputs.mode == 'publish'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download previously verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.verification_run_id }}
          github-token: ${{ github.token }}

      - name: Download prior verification proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-verification-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: verification-proof
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.verification_run_id }}
          github-token: ${{ github.token }}

      - name: Revalidate proof, current main, CI, and unpublished state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py verify-proof \
            --asset-directory release-assets \
            --proof verification-proof/release-verification.json \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          python3 scripts/release_contract.py verify-main \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"

      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "GNFS ${RELEASE_TAG}" \
            "" \
            "Source revision: ${TARGET_SHA}" \
            "" \
            "The macOS Workbench is ad-hoc signed and is not Apple notarized." \
            "Verify every downloaded file with SHA256SUMS." \
            > release-notes.md
          gh release create "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --draft \
            release-assets/GNFSWorkbench-0.1.0-macOS-arm64.zip \
            release-assets/gnfs-v0.1.0-linux-x86_64.tar.gz \
            release-assets/gnfs-v0.1.0-macos-arm64.tar.gz \
            release-assets/gnfs-v0.1.0-windows-x86_64.zip \
            release-assets/release-metadata.json \
            release-assets/SHA256SUMS

      - name: Verify draft tag and asset set, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(gh api \
            "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha')
          if [[ "${tag_sha}" != "${TARGET_SHA}" ]]; then
            echo "Release tag resolved to ${tag_sha}, expected ${TARGET_SHA}." >&2
            exit 1
          fi
          gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" \
            --json isDraft,assets \
            --jq '
              if .isDraft != true then error("release is not draft") else . end
              | [.assets[].name] | sort
              | if . == [
                  "GNFSWorkbench-0.1.0-macOS-arm64.zip",
                  "SHA256SUMS",
                  "gnfs-v0.1.0-linux-x86_64.tar.gz",
                  "gnfs-v0.1.0-macos-arm64.tar.gz",
                  "gnfs-v0.1.0-windows-x86_64.zip",
                  "release-metadata.json"
                ] then . else error("release asset set mismatch") end
            '
          gh release edit "${RELEASE_TAG}" --repo "${REPOSITORY}" --draft=false
          gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" \
            --json isDraft \
            --jq 'if .isDraft == false then . else error("release remained draft") end'
