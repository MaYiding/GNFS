name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify artifacts first, then publish the exact verified bytes'
        required: true
        type: choice
        options:
          - verify-only
          - publish
      release_tag:
        description: 'First release tag (contract-locked to v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      target_sha:
        description: 'Current origin/main full 40-character SHA'
        required: true
        type: string
      confirmation:
        description: 'Type VERIFY v0.1.0 or PUBLISH v0.1.0 to match the selected mode'
        required: true
        type: string

permissions:
  actions: read  # Resolve exact-SHA runs and download immutable artifacts.
  checks: read  # Match required jobs to commit check runs.
  contents: read  # Checkout source and inspect main/tag refs.
  security-events: read  # Bind exact-main CodeQL analysis evidence.

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact main SHA and CI preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verification_run_id: ${{ steps.prior.outputs.verification_run_id }}
      verification_run_attempt: ${{ steps.prior.outputs.verification_run_attempt }}
      workbench_run_id: ${{ steps.main-ci.outputs.workbench_run_id }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate immutable dispatch inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release_contract.py validate-dispatch \
            --mode "${MODE}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --confirmation "${CONFIRMATION}" \
            --repository "${REPOSITORY}" \
            --workflow-ref "${WORKFLOW_REF}" \
            --workflow-sha "${WORKFLOW_SHA}"

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Verify releasable state and required main CI
        id: main-ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          release_state_args=()
          if [[ "${MODE}" == "publish" ]]; then
            release_state_args+=(--allow-exact-published)
          fi
          python3 scripts/release_contract.py verify-main \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --evidence-output main-ci-evidence/main-ci-evidence.json \
            --github-output "${GITHUB_OUTPUT}" \
            "${release_state_args[@]}"

      - name: Verify release protection boundary
        if: inputs.mode == 'verify-only' || steps.main-ci.outputs.release_state != 'published-immutable'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release_contract.py verify-protection \
            --repository "${REPOSITORY}" \
            --allow-unreadable-immutable-setting

      - name: Upload exact-SHA main CI evidence
        if: inputs.mode == 'verify-only'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-main-ci-evidence-${{ github.run_id }}
          path: main-ci-evidence/main-ci-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Find successful verify-only evidence
        id: prior
        if: inputs.mode == 'publish'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py find-verification \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  qualification:
    name: Deep release qualification
    if: inputs.mode == 'verify-only'
    needs: preflight
    uses: ./.github/workflows/release-qualification.yml
    with:
      target_sha: ${{ inputs.target_sha }}
    permissions:
      contents: read

  package-linux:
    name: Package linux-x86_64 on glibc 2.31
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ubuntu-24.04
    container: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    timeout-minutes: 75
    defaults:
      run:
        shell: bash

    steps:
      - name: Install Ubuntu 20.04 build environment
        run: |
          set -euo pipefail
          apt_opts=(
            -o Acquire::Retries=4
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          apt-get "${apt_opts[@]}" update
          DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y \
            --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gnupg \
            python3 \
            python3-pip
          [[ "$(dpkg --print-architecture)" == amd64 ]]

          key_fingerprint='C8EC952E2A0E1FBDC5090F6A2C277A0A352154E5'
          key_url="https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&exact=on&search=0x${key_fingerprint}"
          key_file=$(mktemp)
          trap 'rm -f -- "${key_file}"' EXIT
          for attempt in 1 2 3 4; do
            if curl --proto '=https' --proto-redir '=https' --fail --silent \
                --show-error --location --connect-timeout 15 --max-time 60 \
                --output "${key_file}" "${key_url}"; then
              break
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo 'Unable to fetch the pinned Ubuntu Toolchain PPA key.' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          primary_fingerprints=$(
            gpg --batch --no-options --show-keys --with-colons "${key_file}" |
              awk -F: '$1 == "pub" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }'
          )
          if [[ "${primary_fingerprints}" != "${key_fingerprint}" ]]; then
            echo 'Ubuntu Toolchain PPA key fingerprint mismatch.' >&2
            exit 1
          fi
          install -d -m 0755 /etc/apt/keyrings
          gpg --batch --yes --dearmor \
            --output /etc/apt/keyrings/ubuntu-toolchain-r-test.gpg "${key_file}"
          chmod 0644 /etc/apt/keyrings/ubuntu-toolchain-r-test.gpg
          cat > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.sources <<'EOF'
          Types: deb
          URIs: https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu/
          Suites: focal
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/ubuntu-toolchain-r-test.gpg
          EOF

          apt-get "${apt_opts[@]}" update
          DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y \
            --no-install-recommends \
            binutils \
            g++-12 \
            gcc-12 \
            libgmp-dev \
            libntl-dev \
            ninja-build
          [[ "$(getconf GNU_LIBC_VERSION)" == 'glibc 2.31' ]]
          for compiler in gcc-12 g++-12; do
            version=$("${compiler}" -dumpfullversion -dumpversion)
            if [[ "${version}" != 12 && "${version}" != 12.* ]]; then
              echo "Unexpected ${compiler} version: ${version}" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py verify-checkout \
            --target-sha "${TARGET_SHA}"

      - name: Install hash-pinned CMake
        run: |
          python3 -m pip install \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement scripts/release-cmake-requirements.txt
          [[ "$(cmake --version | awk 'NR == 1 { print $3 }')" == '3.31.6' ]]

      - name: Capture source date epoch
        id: source
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Configure and build
        run: |
          cmake -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF
          cmake --build build-release --parallel

      - name: Verify, install, and archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          package_name="gnfs-${RELEASE_TAG}-linux-x86_64"
          prefix="dist/${package_name}"
          cmake --install build-release --prefix "${prefix}"
          python3 scripts/release_binary_contract.py linux \
            --executable "${prefix}/bin/gnfs" \
            --metadata-output "${prefix}/binary-compatibility.json" \
            --readme-output "${prefix}/README-release.txt" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          version_output=$("${prefix}/bin/gnfs" --version)
          if [[ "${version_output}" != "GNFS ${RELEASE_TAG}" ]]; then
            echo "CLI version ${version_output} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          cp LICENSE "${prefix}/LICENSE"
          printf '%s\n' \
            "THIRD-PARTY NOTICES" \
            "" \
            "GMP and NTL dynamic libraries are not bundled in this archive." \
            "Exact GLIBC, GLIBCXX, and CXXABI requirements are in binary-compatibility.json." \
            "Install compatible host copies and consult their separately distributed licenses." \
            > "${prefix}/THIRD_PARTY_NOTICES.txt"
          mkdir packages
          python3 scripts/reproducible_archive.py create \
            --source "${prefix}" \
            --output "packages/${package_name}.tar.gz" \
            --format tar.gz \
            --epoch "${SOURCE_DATE_EPOCH}"
          python3 scripts/release_contract.py validate-cli-archive \
            --archive "packages/${package_name}.tar.gz" \
            --platform linux-x86_64 \
            --release-tag "${RELEASE_TAG}"

      - name: Upload packaged Linux CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnfs-linux-x86_64
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  package-cli:
    name: Package ${{ matrix.asset_suffix }}
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset_suffix: macos-arm64
            archive_format: tar.gz
            python: python3
          - os: windows-2022
            asset_suffix: windows-x86_64
            archive_format: zip
            python: python

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          PYTHON: ${{ matrix.python }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          "${PYTHON}" scripts/release_contract.py verify-checkout \
            --target-sha "${TARGET_SHA}"

      - name: Capture source date epoch
        id: source
        shell: bash
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp ntl

      - name: Install dependencies (Windows / MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install exact Windows compiler and runtime packages
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python scripts/windows_release_runtime.py install-pinned \
            --download-directory pinned-windows-packages \
            --evidence-output pinned-windows-packages.json

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGNFS_BUILD_TESTS=OFF \
            -DGNFS_ENABLE_NTL=OFF \
            -DGNFS_ENABLE_NATIVE_ARCH=OFF

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build-release --config Release --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build-release --parallel

      - name: Install and archive (macOS)
        if: runner.os == 'macOS'
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="gnfs-${RELEASE_TAG}-${ASSET_SUFFIX}"
          prefix="dist/${package_name}"
          cmake --install build-release --prefix "${prefix}"
          python3 scripts/release_binary_contract.py macos \
            --executable "${prefix}/bin/gnfs"
          version_output=$("${prefix}/bin/gnfs" --version)
          if [[ "${version_output}" != "GNFS ${RELEASE_TAG}" ]]; then
            echo "CLI version ${version_output} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          cp LICENSE "${prefix}/LICENSE"
          printf '%s\n' \
            "GNFS ${RELEASE_TAG}" \
            "Built from ${TARGET_SHA}" \
            "macOS arm64; requires macOS 13.0 or newer." \
            "GMP and NTL dynamic libraries are required from the host and are not bundled." \
            "See LICENSE and THIRD_PARTY_NOTICES.txt." \
            > "${prefix}/README-release.txt"
          printf '%s\n' \
            "THIRD-PARTY NOTICES" \
            "" \
            "GMP and NTL dynamic libraries are not bundled in this archive." \
            "Install compatible host copies and consult their separately distributed licenses." \
            > "${prefix}/THIRD_PARTY_NOTICES.txt"
          mkdir -p packages
          python3 scripts/reproducible_archive.py create \
            --source "${prefix}" \
            --output "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --format "${ARCHIVE_FORMAT}" \
            --epoch "${SOURCE_DATE_EPOCH}"
          python3 scripts/release_contract.py validate-cli-archive \
            --archive "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --platform macos-arm64 \
            --release-tag "${RELEASE_TAG}"

      - name: Install and archive (Windows)
        if: runner.os == 'Windows'
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          package_name="gnfs-${RELEASE_TAG}-${ASSET_SUFFIX}"
          prefix="dist/${package_name}"
          cmake --install build-release --prefix "${prefix}"
          python scripts/windows_release_runtime.py bundle \
            --package-root "${prefix}" \
            --executable "${prefix}/bin/gnfs.exe" \
            --pinned-package-evidence pinned-windows-packages.json \
            --project-license LICENSE \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          mkdir -p packages
          python scripts/reproducible_archive.py create \
            --source "${prefix}" \
            --output "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --format "${ARCHIVE_FORMAT}" \
            --epoch "${SOURCE_DATE_EPOCH}"
          python scripts/release_contract.py validate-cli-archive \
            --archive "packages/${package_name}.${ARCHIVE_FORMAT}" \
            --platform windows-x86_64 \
            --release-tag "${RELEASE_TAG}"

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnfs-${{ matrix.asset_suffix }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  collect-gnfs-source:
    name: Collect exact-SHA GNFS source
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Create and validate exact-SHA source archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py create-gnfs-source \
            --output-directory gnfs-source \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          python3 scripts/release_contract.py validate-gnfs-source \
            --archive "gnfs-source/gnfs-${RELEASE_TAG}-source.tar.gz" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"

      - name: Upload exact-SHA GNFS source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnfs-project-source
          path: gnfs-source/*
          if-no-files-found: error
          retention-days: 30

  collect-dependency-sources:
    name: Collect pinned GMP, NTL, and MSYS2 sources
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download and validate pinned dependency sources
        run: |
          python3 scripts/release_contract.py fetch-sources \
            --output-directory dependency-sources
          python3 scripts/release_contract.py validate-sources \
            --source-directory dependency-sources

      - name: Upload pinned dependency sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnfs-dependency-sources
          path: dependency-sources/*
          if-no-files-found: error
          retention-days: 30

  collect-workbench:
    name: Collect exact-SHA Workbench artifact
    if: inputs.mode == 'verify-only'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download Workbench artifact from the exact push run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gnfs-workbench-macos-arm64
          path: workbench-ci
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.workbench_run_id }}
          github-token: ${{ github.token }}

      - name: Validate Workbench checksum and embedded source revision
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python3 scripts/release_contract.py validate-workbench \
            --artifact-directory workbench-ci \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}"
          mkdir packages
          cp "workbench-ci/GNFSWorkbench-${RELEASE_TAG#v}-macOS-arm64.zip" packages/

      - name: Upload verified Workbench package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnfs-workbench
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  assemble-verification:
    name: Assemble immutable verification bundle
    if: inputs.mode == 'verify-only'
    needs:
      - preflight
      - qualification
      - package-linux
      - package-cli
      - collect-gnfs-source
      - collect-dependency-sources
      - collect-workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download package jobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gnfs-*
          path: release-assets
          merge-multiple: true

      - name: Download exact-SHA main CI evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-main-ci-evidence-${{ github.run_id }}
          path: main-ci-evidence

      - name: Generate metadata, checksums, and verification proof
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python3 scripts/release_contract.py assemble \
            --asset-directory release-assets \
            --release-tag "${RELEASE_TAG}" \
            --source-date-epoch "${source_date_epoch}" \
            --target-sha "${TARGET_SHA}"
          mkdir verification-proof
          python3 scripts/release_contract.py write-proof \
            --asset-directory release-assets \
            --ci-evidence main-ci-evidence/main-ci-evidence.json \
            --output verification-proof/release-verification.json \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --repository "${REPOSITORY}" \
            --workflow-run-id "${WORKFLOW_RUN_ID}" \
            --workflow-run-attempt "${WORKFLOW_RUN_ATTEMPT}" \
            --server-url "${SERVER_URL}"

      - name: Upload immutable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: verification-proof/release-verification.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish previously verified bytes
    if: inputs.mode == 'publish'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read  # Download the exact prior verification artifacts.
      checks: read  # Recheck exact-SHA required job contexts.
      contents: write  # Create the locked tag, draft, and release assets.
      security-events: read  # Recheck exact-main CodeQL analysis before publication.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/release_contract.py verify-checkout --target-sha "${TARGET_SHA}"

      - name: Download previously verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.verification_run_id }}
          github-token: ${{ github.token }}

      - name: Download prior verification proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verification-${{ inputs.release_tag }}-${{ inputs.target_sha }}
          path: verification-proof
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.verification_run_id }}
          github-token: ${{ github.token }}

      - name: Revalidate proof and publish or recovery state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          VERIFICATION_WORKFLOW_RUN_ATTEMPT: ${{ needs.preflight.outputs.verification_run_attempt }}
          VERIFICATION_WORKFLOW_RUN_ID: ${{ needs.preflight.outputs.verification_run_id }}
        run: |
          python3 scripts/release_contract.py verify-proof \
            --asset-directory release-assets \
            --proof verification-proof/release-verification.json \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --repository "${REPOSITORY}" \
            --expected-workflow-run-id "${VERIFICATION_WORKFLOW_RUN_ID}" \
            --expected-workflow-run-attempt "${VERIFICATION_WORKFLOW_RUN_ATTEMPT}"
          python3 scripts/release_contract.py verify-main \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --allow-exact-published

      - name: Create or safely resume exact draft release
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          VERIFICATION_WORKFLOW_RUN_ATTEMPT: ${{ needs.preflight.outputs.verification_run_attempt }}
          VERIFICATION_WORKFLOW_RUN_ID: ${{ needs.preflight.outputs.verification_run_id }}
        run: |
          python3 scripts/release_contract.py prepare-draft \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --asset-directory release-assets \
            --proof verification-proof/release-verification.json \
            --verification-workflow-run-id "${VERIFICATION_WORKFLOW_RUN_ID}" \
            --verification-workflow-run-attempt "${VERIFICATION_WORKFLOW_RUN_ATTEMPT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Publish exact draft and verify immutable public state
        env:
          EXPECTED_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          VERIFICATION_WORKFLOW_RUN_ATTEMPT: ${{ needs.preflight.outputs.verification_run_attempt }}
          VERIFICATION_WORKFLOW_RUN_ID: ${{ needs.preflight.outputs.verification_run_id }}
        shell: bash
        run: |
          python3 scripts/release_contract.py publish-release \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --target-sha "${TARGET_SHA}" \
            --expected-release-id "${EXPECTED_RELEASE_ID}" \
            --asset-directory release-assets \
            --proof verification-proof/release-verification.json \
            --verification-workflow-run-id "${VERIFICATION_WORKFLOW_RUN_ID}" \
            --verification-workflow-run-attempt "${VERIFICATION_WORKFLOW_RUN_ATTEMPT}"
