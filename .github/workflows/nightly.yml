name: Nightly Deep Tests

on:
  schedule:
    - cron: '0 17 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-thorough:
    name: Release thorough regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh libgmp-dev libntl-dev

      - name: Run thorough test workflow
        run: ./scripts/test.sh -t Release thorough

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-ctest-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/test_report.json
          if-no-files-found: ignore
          retention-days: 14
