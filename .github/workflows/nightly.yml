name: Nightly Deep Tests

on:
  schedule:
    - cron: '0 17 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-qualification:
    name: Reusable release qualification
    uses: ./.github/workflows/release-qualification.yml
    with:
      target_sha: ${{ github.sha }}
