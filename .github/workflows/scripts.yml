name: Script Checks

on:
  push:
    branches: [ main, dev ]
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.github/workflows/scripts.yml'
      - '.gitignore'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/harness-engineering.md'
      - 'scripts/**'
      - 'tests/*.sh'
  pull_request:
    branches: [ main, dev ]
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.github/workflows/scripts.yml'
      - '.gitignore'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/harness-engineering.md'
      - 'scripts/**'
      - 'tests/*.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: zsh/bash syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            zsh -n "${file}"
          done < <(git ls-files 'scripts/*.sh' 'scripts/perf/*.sh' 'tests/*.sh' \
            | xargs grep -l '^#!/usr/bin/env zsh')

          while IFS= read -r file; do
            bash -n "${file}"
          done < <(git ls-files '.claude/hooks/*.sh' 'scripts/*.sh' 'scripts/perf/*.sh' 'tests/*.sh' \
            | xargs grep -l '^#!/usr/bin/env bash')

          python3 -m py_compile .claude/hooks/project-guard.py scripts/check_harness.py

      - name: Check test catalog
        run: zsh ./scripts/test.sh list >/tmp/gnfs-test-list.txt

      - name: Check agent Harness
        run: |
          python3 scripts/check_harness.py
          bash tests/test_harness_hooks.sh
