name: Sanitizers

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: AddressSanitizer + UBSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libntl-dev

    - name: Configure with sanitizers
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: make -C build -j"$(nproc)"

    - name: Run instant tests under sanitizers
      working-directory: build
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Sanitizers slow execution 5-10x; keep this to isolated instant tests.
      run: |
        ctest --output-on-failure \
          --label-regex "instant" \
          --label-exclude "bench|slow|heavy|stress|gate" \
          --parallel 2 \
          --timeout 300

  tsan:
    name: ThreadSanitizer (structured relation)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libgmp-dev libntl-dev zsh

    - name: Run narrow structured-relation lane under ThreadSanitizer
      env:
        CC: clang
        CXX: clang++
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      run: ./scripts/test.sh --no-color --timeout 120 tsan-relation
